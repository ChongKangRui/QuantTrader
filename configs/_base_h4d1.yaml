# ── PRESET · H4->D1 (the "new strategy": Daily bias, H4 sweep entry) ─────
# Copy of configs/_base.yaml, retuned 2026-10-19. NOT active while named
# `_base_*` (the engine reads `configs/_base.yaml` only).
# Apply:   Copy-Item configs/_base_h4d1.yaml configs/_base.yaml -Force
# Revert:  Copy-Item configs/_base_h1h4.yaml configs/_base.yaml -Force
#
# How the spec maps to these knobs:
#   Daily bias (EMA20 vs EMA100, flat if close crosses EMA100 against it)
#     -> B1 on the D1 regime chart + HR1 (close-based, 0.3 ATR band) ≈ flat rule
#   H4 EMA 20/100 must align with the Daily bias
#     -> W1's alignment check (entry chart fast/slow must agree with regime bias)
#   Candle low/high penetrates AGAINST the H4 EMA20 (EMA100 ignored)
#     -> W1 sweep, w1_pen_atr 0.0 (any touch counts)
#   Candle OPEN must be aligned with the H4 EMA direction
#     -> w1_open_side: true
#   Enter in the Daily bias direction after the H4 candle closes
#     -> execution grid H1->H4 flip + the engine's t/t+1 model (unchanged)
#   RR 1:2.5 -> tp_mult 2.5;  trailing -> off, evaluated as its own run later
#   Max 2/pair/week + loss disables the pair for the day
#     -> NOT BUILT yet: no such knobs exist; runs cannot enforce them (limits note below)

# Shared defaults for every pair. Pair files set: symbol + costs ONLY.
# Strategy/risk all live here; pair-level copies of those blocks are ignored
# (single source of truth — locked by test_load_pairs_strategy_comes_only_from_base).
# Engine + live trader read the SAME keys. Gate codes, units, how-to: configs/README.md

# ────────────────────────────────────────────────────────────────────────
# TIMEFRAMES · when the system runs
# ────────────────────────────────────────────────────────────────────────
timeframes:
  execution: H4          # entry bar grid: H4 in this combo (then regime must be D1)
  regime: D1             # bias chart: the DAILY chart (allowed combo: H4->D1)
                         # both grids derive from the H1 CSV (00:00 UTC anchor);
                         # live fetches both from the broker.
  position_checks: M1    # stop/TP/trail checked on M1 feed, H4 when M1 missing

# ────────────────────────────────────────────────────────────────────────
# EXECUTION · same t / t+1 model in the backtest and the live loop
# ────────────────────────────────────────────────────────────────────────
execution:
  signal_bar: t                # decisions read the LAST CLOSED bar only
  fill_bar: t+1                # the order fills on the NEXT bar open (no lookahead)
  fill: next_open_plus_costs   # fill price = next bar open + spread/slippage

# ────────────────────────────────────────────────────────────────────────
# STRATEGY · gates in run order: D1 bias -> H4 entry -> open trade -> tests
# ═══ Gate codes: B1 HR1 E1-setup E1-trigger HR2 HR3 HR4 EXT W1 (configs/README.md)
# Every use_x: false = that gate auto-passes and its knobs are ignored.
# ════════════════════════════════════════════════════════════════════════
strategy:

  # ════════════════════════════════════════════════════════════════════
  # BIAS · B1 + HR1 · the DAILY chart decides direction only (UP/DOWN/FLAT)
  # (same bias* keys as always — here they are read on D1 bars)
  # HR1 (close past the D1 EMA100 against the trend) ≈ the spec's
  # "closes beyond EMA100 against the EMA direction -> flat, do not trade"
  # ════════════════════════════════════════════════════════════════════
  bias:
    h4_ema_fast: 20         # DAILY trend EMA (fast side), spec EMA 20
    h4_ema_slow: 100        # DAILY trend EMA (long side); fast above slow = UP bias
    use_atr_sep: true       # false = MA-only: no HR1 band, no NEUTRAL
    h4_atr_n: 14            # D1 ATR period behind the HR1 separation band
    hr1: a                  # HR1 band: a = close / b = body / c = whole candle
    sep_atr: 0.3            # HR1 band width in D1 ATR (EMAs must stay this apart)
    warmup_bars: 100        # NOTE: 100 D1 bars ≈ 5 months of warmup; the D1 EMA100
                            # is only partly converged there. Changing this number
                            # is a separate run decision (one change per run).

  # ════════════════════════════════════════════════════════════════════
  # ENTRY · W1 sweep on the LAST CLOSED H4 bar (fills next H4 open)
  # ════════════════════════════════════════════════════════════════════
  entry:
    # Shared yardstick for every gate below (and for the stop).
    atr_n: 7                # H4 ATR period (n)
    h1_ema_fast: 20         # entry-chart fast EMA = the H4 EMA20 of the spec
    h1_ema_slow: 100        # entry-chart slow EMA = the H4 EMA100 (alignment side)

    # ── E1-setup · the H1-system pullback: NOT in this spec -> OFF ───
    use_e1_setup: false     # auto-passes; knobs below stay live (never delete)
    lookback: 5             # H4 bars a zone touch is searched within (unused while off)
    touch_atr: 0.5          # (unused while off)
    breakdown_atr: 1.0      # (unused while off)

    # ── E1-trigger · the H1-system fire button: NOT in this spec -> OFF ─
    use_e1_trigger: false   # entries fire on the W1 sweep instead

    # ── HR2 · candle conviction: not in the spec -> OFF ─────────────
    # Re-enable to require the right color + min body share on the sweep candle.
    use_hr2: false
    min_body_ratio: 0.5     # (unused while off)

    # ── OFF by default (unchanged from the base system) ─────────────
    # EXT · "not stretched": close stays close to the fast EMA
    use_ext: false
    ext_atr: 1.5            # max stretch from the fast EMA (H4 ATR)

    # HR3 · "candle not too big": never chase a giant bar
    use_hr3: false
    max_body_atr: 1.5       # max candle body (H4 ATR)

    # HR4 · "swing structure intact": recent higher-low (LONG) / lower-high (SHORT)
    use_hr4: false
    edge_atr: 1.5           # max distance from close to the swing (H4 ATR)
    pivot_n: 3              # pivot confirmation bars, left + right
    hl_guard: false         # HR4 extra: no NEW lower-low (LONG) since the swing

    # W1 · THE entry condition of this preset: the closed H4 candle's wick
    # pokes against the H4 EMA20 (high above it for SHORT / low below it for
    # LONG) while the H4 20/100 relation agrees with the DAILY bias direction.
    # The EMA100 side is irrelevant to the sweep itself (spec: don't care).
    use_w1: true            # ON: the sweep is required for every entry
    w1_open_side: true      # spec: candle OPEN must be on the trade side of EMA20
    w1_pen_atr: 0.0         # any touch counts (raise to demand a deeper sweep)

  # ════════════════════════════════════════════════════════════════════
  # OPEN TRADE · after the fill (live attaches SL/TP on the broker)
  # ════════════════════════════════════════════════════════════════════
  open_trade:
    stop_atr: 1.5           # stop distance at fill (H4 ATR at t; S1 style)
    tp_mult: 2.5            # spec RR 1:2.5 (1:3 = the alternative to test later)
    use_trail: false        # trailing = a SEPARATE exit model, its own run later
    trail_r: 1.5            # (unused while off)
    use_be: false           # breakeven lift: stop -> entry (+buffer) when armed
    be_trigger_r: 1.0       # R of profit that arms BE (or the trail) (R)
    be_buffer: 0            # extra pips beyond entry on the BE stop (pips)

  # ════════════════════════════════════════════════════════════════════
  # EXPERIMENTAL · off by default; backtest CLI can force one run
  # ════════════════════════════════════════════════════════════════════
  experimental:
    bias_flip_exit: false   # exit when the D1 bias flips against the trade
    weekend_flat: false     # force-close before the weekend

# ────────────────────────────────────────────────────────────────────────
# RISK · portfolio caps, enforced by the backtest pass AND the live loop
# (1 open position per pair is structural — not a knob here)
# ────────────────────────────────────────────────────────────────────────
risk:
  max_total_positions: 5      # max open trades, all pairs combined (0 = off)
  max_ccy_net: 2              # max NET positions per currency (0 = off)
                              # long EURUSD = +EUR/-USD; hedging nets to ~0
                              # basically determine how many same direction of trade to pair
                              # like EURUSD and GBPUSD both bet for buy, but not USDCHF for sell
                              # if example is 2
  # SIZING MODE SWITCH · the switch decides WHO sets the 1R target; the
  # fence (sizing_scope_usd) judges the RESULT in both modes.
  # false = FENCE sizing: the floor IS the target — buy the smallest
  #   0.01-lot multiple whose 1R reaches `low`; refuse the trade when that
  #   overshoots `high` (or when even 0.01 lot risks more than `high`).
  #   Same 1R USD every trade, whatever the account — no compounding.
  # true  = PERCENT sizing: the target is `balance_risk_pct` % x the account
  #   balance at entry (backtest: the sim balance that starts at
  #   benchmarks.account_usd and moves only with CLOSED trades; live: the
  #   MT5 balance). The fence then only guards — keep the aim at or above
  #   the floor (pct x balance >= low), else entries refuse as scale-low.
  #   Wins grow the aim, losses shrink it: compounding, never martingale.
  scale_lot_with_balance: true  # ON in this preset: percent sizing (the compounding experiment)
  balance_risk_pct: 3.0          # read only when the switch above is ON
  sizing_scope_usd:           # every trade's 1R must land inside (USD)
    low: 4                  # minimum 1R (USD; 0 = no minimum)
    high: 5.5                 # maximum 1R (USD; 0 = no maximum)
                              # NOTE for H4 stops (measured 2026-10-19, median
                              # 1.5xATR7 of ~500 bars): one 0.01 lot risks ~USD
                              # 2.2-4.9 per pair, so no lot fits where 1 brick is
                              # below `low` and 2 bricks exceed `high` (bricks
                              # USD 2.75-4.00 at 4/5.5) — EURUSD, USDJPY, USDCHF,
                              # EURJPY typically refuse every entry. Widening
                              # `high` (e.g. 8) revives them: a deliberate run
                              # decision, logged as its own change.

# ────────────────────────────────────────────────────────────────────────
# COSTS · backtest assumptions; pair files override with sampled values
# ────────────────────────────────────────────────────────────────────────
costs:
  spread_points: 20           # BACKTEST spread (points; 20 pts = 2.0 pips)
  swap_long_per_0_01: -0.08   # nightly carry, long (ccy per 0.01 lot/night)
  swap_short_per_0_01: -0.08  # nightly carry, short (ccy per 0.01 lot/night)
  commission_per_lot: 0.0     # commission per 1.0 lot per SIDE (USD); Standard account
                              # = 0 by decision 2026-10-19 (spread covers it); Razor ~3.5/side
  slippage_pips: 0.0          # assumed fill slip (pips; backtest and live); 0 by decision
                              # 2026-10-19 — charged on exits only in the engine

# Triple swap = broker charges 3x on the Wednesday rollover; the engine
# approximates it as the first bar after Wed 21:xx UTC (hardcoded, STRATEGY 10).

# ── ACCOUNT · the PnL / 1R reporting unit for the backtest ────────────
account:
  currency: USD               # account currency

# ────────────────────────────────────────────────────────────────────────
# LIMITS · entry caps, same rules in the backtest and the live loop
# (0 on any limit = that rule off)
# ────────────────────────────────────────────────────────────────────────
limits:
  # SPEC "max 2 per pair per week" + "a loss disables the pair for the day"
  # are NOT ENFORCED anywhere — no such knobs exist yet. This preset runs
  # without them; the engine caps only what is listed below.
  weekly_loss_r: 3.0          # BACKTEST weekly halt: week's CLOSED R total <= -this (8A; 0 = off)
  weekly_loss_pct: 15.0       # LIVE/panel weekly halt: % of week-start equity (live only)
  max_trades_per_day: 20      # portfolio-wide, per day
  max_cost_ratio: 0.10        # round-trip cost < this share of stop distance
  no_trade_ranges:            # {start,end} = MM-DD UTC; wraps the New Year
    - { start: "12-15", end: "01-01" }   # no NEW fills inside; open trades keep SL/TP/trail

# ── LIVE · real-order plumbing; read by the live trading loop only ─────
live:
  magic: 100001               # every order we send/adopt carries this (0 = ignore)
  dry_run_default: true       # trading loop starts in dry-run (plans only)

# ────────────────────────────────────────────────────────────────────────
# BENCHMARKS · backtest grading only: PASS/WARN/FAIL bands per metric
# ────────────────────────────────────────────────────────────────────────
benchmarks:
  account_usd: 100            # drawdown % is graded against this equity
  max_dd_pct: { good: 30.0, ok: 50.0 }
  profit_factor: { good: 1.50, ok: 1.00 }
  expect_r: { good: 0.10, ok: 0.00 }
  per_month: { good: 2.0, ok: 0.2 }
  worst_year_r: { ok: -20.0 }
