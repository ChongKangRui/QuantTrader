# Scan selection: tick which pairs take part in monitor scans and backtest batches.
# enabled: false skips the pair (one compact line on the console, batch continues).
# Broker CSV batches require H4/D1 for every enabled pair; legacy mode skips missing H1.
# Files ending _untrade.yml are never loaded (see NZDUSD_untrade.yml).
pairs:
  EURUSD: {enabled: true}
  GBPUSD: {enabled: true}
  USDJPY: {enabled: true}
  USDCHF: {enabled: true}
  AUDUSD: {enabled: true}
  USDCAD: {enabled: true}
  EURJPY: {enabled: true}
  GBPJPY: {enabled: true}
  EURGBP: {enabled: true}
  NZDUSD: {enabled: true}
