# Shared defaults. Per-pair files override risk/strategy only; costs are global.
# Units: spread in POINTS (20 pts = 2.0 pips), swaps in account-ccy per 0.01 lot/night.
# No M1 rows for an hour -> H1 fallback checks. Build M1: uv run python -m quant.mkdata --symbol <SYM> --m1-csv
timeframes: { execution: H1, regime: H4, position_checks: M1 }
regime_rule: TODO_define
execution: { signal_bar: t, fill_bar: t+1, fill: next_open_plus_costs }
costs: { spread_points: 20, swap_long_per_0_01: -0.08, swap_short_per_0_01: -0.08, triple_swap_days: [Wednesday, weekend], commission_per_lot: 0.0, slippage_pips: 0.3 }
# Backtest sizing scope: every trade's 1R must land inside [low, high] USD.
risk: { risk_pct: 0.5, max_positions_per_pair: 1, max_total_positions: 4,
        sizing_scope_usd: { low: 2.5, high: 3.6 } }
account: { currency: USD, contract_size: 100000 }
live: { magic: 100001, dry_run_default: true }
limits:
  weekly_loss_pct: 15.0    # halt new entries at this % of week-start equity
  max_trades_per_day: 20   # 0 = off
  max_cost_ratio: 0.10     # new entries: round-trip cost below this share of stop distance (0 = off)
  # {start, end} = MM-DD UTC ranges (wrap the New Year). No NEW fills inside.
  no_trade_ranges:
    - { start: "12-15", end: "01-01" }
benchmarks:
  account_usd: 100         # drawdown % is graded against this equity
  max_dd_pct: { good: 30.0, ok: 50.0 }
  profit_factor: { good: 1.50, ok: 1.00 }
  expect_r: { good: 0.10, ok: 0.00 }
  per_month: { good: 2.0, ok: 0.2 }
  worst_year_r: { ok: -20.0 }
# use_x: false = that gate auto-passes, its knobs just sit idle. h4_* = 4H bias
# chart, h1_* = 1H entry chart. Pair files never set these.
strategy:
  # --- 4H bias, last closed H4 bar ---
  use_atr_sep: true    # false = MA-only, no HR1, no NEUTRAL
  h4_ema_fast: 20
  h4_ema_slow: 100
  h4_atr_n: 14
  hr1: a               # a close / b body / c whole candle past h4_ema_slow
  sep_atr: 0.3
  warmup_bars: 100
  # --- 1H entry, closed signal bar (fill = next open) ---
  atr_n: 7
  h1_ema_fast: 20
  h1_ema_slow: 50
  use_e1_setup: true
  lookback: 5
  touch_atr: 0.5
  breakdown_atr: 1.0
  use_e1_trigger: true
  use_ext: false
  ext_atr: 1.5
  use_hr2: true
  min_body_ratio: 0.5
  use_hr3: false
  max_body_atr: 1.5
  use_hr4: false
  edge_atr: 1.5
  pivot_n: 3
  hl_guard: false
  # --- open trade (after the fill) ---
  stop_atr: 1.5
  tp_mult: 3.0
  use_trail: false
  trail_r: 1.5
  use_be: false
  be_trigger_r: 1.0
  be_buffer: 0
  bias_flip_exit: false
  weekend_flat: false
